spring:
  application:
    name: clientdesk-test
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  jwt:
    secret: "test-jwt-secret-key-at-least-32-chars-long-1234567890"
    expiration-ms: 86400000
  cors:
    allowed-origins: "http://localhost:3000,http://localhost:5173"
  logging:
    event-log-file: "logs/test-events.log"
