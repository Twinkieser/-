version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: clientdesk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clientdesk}
      POSTGRES_USER: ${POSTGRES_USER:-clientdesk_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clientdesk_user} -d ${POSTGRES_DB:-clientdesk}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - clientdesk-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clientdesk-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-clientdesk}
      DB_USER: ${POSTGRES_USER:-clientdesk_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (must be at least 32 characters)}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      PORT: 8080
    volumes:
      - backend-logs:/app/logs
    networks:
      - clientdesk-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: clientdesk-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - clientdesk-network

volumes:
  pgdata:
    driver: local
  backend-logs:
    driver: local

networks:
  clientdesk-network:
    driver: bridge
